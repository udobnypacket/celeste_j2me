name: build-j2me
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download MIDP/CLDC API and ProGuard
        run: |
          mkdir -p tools
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fL -o tools/cldc.jar $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar
          curl -fL -o tools/midp.jar $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar
          curl -fL -o tools/pg.zip https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
          unzip -q tools/pg.zip -d tools
      - name: Compile
        run: |
          mkdir -p build/classes
          javac -source 1.5 -target 1.5 -cp tools/midp.jar:tools/cldc.jar -d build/classes src/*.java
          cp res/data.bin build/classes/
          jar cf build/raw.jar -C build/classes .
      - name: Preverify (ProGuard -microedition)
        run: |
          java -jar tools/proguard-7.4.2/lib/proguard.jar @proguard.pro \
            -injars build/raw.jar -outjars build/pre.jar \
            -libraryjars tools/cldc.jar -libraryjars tools/midp.jar \
            -target 1.3
      - name: Package jar + jad
        run: |
          mkdir -p out build/x
          cd build/x && unzip -q ../pre.jar && rm -rf META-INF && cd ../..
          jar cfm out/Celeste.jar MANIFEST.MF -C build/x .
          SZ=$(stat -c %s out/Celeste.jar)
          printf 'MIDlet-1: Celeste, , CelesteMIDlet\nMIDlet-Name: Celeste Classic\nMIDlet-Vendor: Port\nMIDlet-Version: 1.0.0\nMIDlet-Jar-URL: Celeste.jar\nMIDlet-Jar-Size: %s\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n' "$SZ" > out/Celeste.jad
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: Celeste-6303i
          path: out/
